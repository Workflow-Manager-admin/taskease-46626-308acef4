<div class="taskease-container">
  <header class="taskease-header">
    <h1>TaskEase</h1>
    <span class="subtitle">Your daily task tracker</span>
  </header>
  <div class="add-task-row">
    <input
      type="text"
      placeholder="Add new task..."
      [(ngModel)]="newTask"
      (keyup)="handleInputKeyup($event)"
      class="add-task-input"
      aria-label="Add new task"
    />
    <button
      class="add-btn"
      (click)="addTask()"
      [disabled]="!newTask.trim().length"
      aria-label="Add task"
    >
      Add
    </button>
  </div>

  <ul class="task-list">
    <li *ngFor="let task of tasks; let i = index" [class.completed]="task.completed">
      <label class="checkbox-wrapper">
        <input
          type="checkbox"
          [checked]="task.completed"
          (change)="toggleCompletion(i)"
          aria-label="Mark as complete"
        />
        <span class="custom-checkbox"></span>
      </label>
      <span class="task-text">{{ task.text }}</span>
      <button class="delete-btn" (click)="deleteTask(i)" aria-label="Delete" title="Delete task">
        🗑️
      </button>
    </li>
    <li *ngIf="tasks.length === 0" class="empty-list-notice">
      No tasks yet. Add your first one!
    </li>
  </ul>
</div>
